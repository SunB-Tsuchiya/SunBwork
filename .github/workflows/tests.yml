name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sunbwork_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug
          extensions: pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Publish Ziggy Configuration
        run: php artisan ziggy:generate

      - name: Build Assets
        run: npm run build

      - name: Create Sales Test Database
        run: mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=root --password=root --execute="CREATE DATABASE IF NOT EXISTS sunbwork_sales_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sunbwork_testing
          DB_USERNAME: root
          DB_PASSWORD: root
          SALES_DB_CONNECTION: mysql
          SALES_DB_HOST: 127.0.0.1
          SALES_DB_PORT: 3306
          SALES_DB_DATABASE: sunbwork_sales_testing
          SALES_DB_USERNAME: root
          SALES_DB_PASSWORD: root
        run: ./vendor/bin/pest
